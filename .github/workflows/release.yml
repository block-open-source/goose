# This workflow builds release artifacts for release branches and publishes tagged releases.
on:
  push:
    paths-ignore:
      - "documentation/**"
    branches:
      - "release/*"
    tags:
      - "v1.*"

name: Release

permissions:
  contents: read

env:
  # Set this repository Actions variable to "true" in GitHub Settings > Secrets and variables
  # > Actions > Variables after a release containing desktop app-update.yml has shipped.
  ENABLE_MAC_NATIVE_AUTO_UPDATE: ${{ vars.ENABLE_MAC_NATIVE_AUTO_UPDATE || 'false' }}
  # Publishes the Linux deb/rpm update manifests (latest-linux*.yml, vulkan-linux*.yml).
  # Until enabled, deb/rpm installs fall back to a GitHub API check that can report
  # a newer version but not install it.
  ENABLE_LINUX_NATIVE_AUTO_UPDATE: ${{ vars.ENABLE_LINUX_NATIVE_AUTO_UPDATE || 'false' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------
  # 1) Bundle CLI and Desktop (Linux)
  # ------------------------------------
  build-cli-linux:
    uses: ./.github/workflows/build-cli-linux.yml
    with:
      package_desktop: true

  # ------------------------------------
  # 2) Upload Install CLI Script
  # ------------------------------------
  install-script:
    name: Upload Install Script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: download_cli.sh
          path: download_cli.sh

  # ------------------------------------------------------------
  # 3) Bundle CLI and Desktop (macOS ARM64)
  # ------------------------------------------------------------
  bundle-macos-arm64:
    uses: ./.github/workflows/bundle-macos.yml
    permissions:
      contents: read
    with:
      target: aarch64-apple-darwin
      package_cli: true
      package_desktop: true
      signing: ${{ startsWith(github.ref, 'refs/tags/') }}
      environment: ${{ startsWith(github.ref, 'refs/tags/') && 'signing' || '' }}
    secrets: inherit

  # ------------------------------------------------------------
  # 4) Bundle CLI and Desktop (macOS x64)
  # ------------------------------------------------------------
  bundle-macos-x64:
    uses: ./.github/workflows/bundle-macos.yml
    permissions:
      contents: read
    with:
      target: x86_64-apple-darwin
      package_cli: true
      package_desktop: true
      signing: ${{ startsWith(github.ref, 'refs/tags/') }}
      environment: ${{ startsWith(github.ref, 'refs/tags/') && 'signing' || '' }}
    secrets: inherit

  # ------------------------------------------------------------
  # 5) Bundle CLI and Desktop (Windows)
  # ------------------------------------------------------------
  bundle-windows:
    uses: ./.github/workflows/bundle-windows.yml
    permissions:
      id-token: write
      contents: read
    with:
      package_cli: true
      package_desktop: true
      signing: ${{ startsWith(github.ref, 'refs/tags/') }}
      environment: ${{ startsWith(github.ref, 'refs/tags/') && 'signing' || '' }}
    secrets: inherit

  bundle-windows-cuda:
    uses: ./.github/workflows/bundle-windows.yml
    permissions:
      id-token: write
      contents: read
    with:
      package_cli: true
      package_desktop: true
      signing: ${{ startsWith(github.ref, 'refs/tags/') }}
      environment: ${{ startsWith(github.ref, 'refs/tags/') && 'signing' || '' }}
      windows_variant: cuda
    secrets: inherit

  # ------------------------------------
  # 6) Create/Update GitHub Release
  # ------------------------------------
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [build-cli-linux, install-script, bundle-macos-arm64, bundle-macos-x64, bundle-windows, bundle-windows-cuda]
    permissions:
      contents: write
      id-token: write      # Required for Sigstore OIDC signing
      attestations: write  # Required for SLSA build provenance attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Create source code bundles
        run: |
          git archive --format=tar.gz --prefix="goose-${GITHUB_REF_NAME}/" --output="goose-source-${GITHUB_REF_NAME}.tar.gz" HEAD
          git archive --format=zip --prefix="goose-${GITHUB_REF_NAME}/" --output="goose-source-${GITHUB_REF_NAME}.zip" HEAD

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: '!internal-*'
          merge-multiple: true

      - name: Generate macOS update manifest
        if: ${{ env.ENABLE_MAC_NATIVE_AUTO_UPDATE == 'true' }}
        run: node ui/desktop/scripts/generate-mac-update-manifest.js --version "${GITHUB_REF_NAME}" --directory .

      - name: Attest macOS update manifest
        if: ${{ env.ENABLE_MAC_NATIVE_AUTO_UPDATE == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: latest-mac.yml

      - name: Generate Linux (deb + rpm) update manifests
        if: ${{ env.ENABLE_LINUX_NATIVE_AUTO_UPDATE == 'true' }}
        # One manifest per arch and per variant; each lists both the .deb and the
        # .rpm, and each updater picks its own extension. The vulkan variant shares
        # the package name with the standard build, so it gets its own channel.
        run: |
          generate() {
            local channel="$1" arch="$2" deb_glob="$3" rpm_glob="$4" out="$5"
            local deb rpm
            deb=$(ls -1 $deb_glob 2>/dev/null | head -n1 || true)
            rpm=$(ls -1 $rpm_glob 2>/dev/null | head -n1 || true)
            if [ -z "$deb" ] && [ -z "$rpm" ]; then
              echo "No ${channel} .deb/.rpm asset for ${arch} found; skipping ${out}."
              return 0
            fi
            local args=(--version "${GITHUB_REF_NAME}" --channel "$channel" --arch "$arch" --out "$out")
            if [ -n "$deb" ]; then args+=(--deb "$deb"); fi
            if [ -n "$rpm" ]; then args+=(--rpm "$rpm"); fi
            node ui/desktop/scripts/generate-linux-update-manifest.js "${args[@]}"
          }

          generate latest x64   'goose_*_amd64.deb'        'Goose-*.x86_64.rpm'        latest-linux.yml
          generate latest arm64 'goose_*_arm64.deb'        'Goose-*.arm64.rpm'         latest-linux-arm64.yml
          generate vulkan x64   'goose_*_amd64-vulkan.deb' 'Goose-*.x86_64-vulkan.rpm' vulkan-linux.yml
          generate vulkan arm64 'goose_*_arm64-vulkan.deb' 'Goose-*.arm64-vulkan.rpm'  vulkan-linux-arm64.yml

      - name: Attest Linux (deb + rpm) update manifests
        if: ${{ env.ENABLE_LINUX_NATIVE_AUTO_UPDATE == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            latest-linux.yml
            latest-linux-arm64.yml
            vulkan-linux.yml
            vulkan-linux-arm64.yml

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            goose-*.tar.bz2
            goose-*.tar.gz
            goose-*.zip
            Goose*.zip
            *.deb
            *.rpm
            *.flatpak
            download_cli.sh

      # Create/update the versioned release
      - name: Release versioned
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd  # v1.21.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: |
            goose-*.tar.bz2
            goose-*.tar.gz
            goose-*.zip
            Goose*.zip
            *.deb
            *.rpm
            *.flatpak
            download_cli.sh
          allowUpdates: true
          omitBody: true
          omitPrereleaseDuringUpdate: true

      # Create/update the stable release
      - name: Release stable
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd  # v1.21.0
        with:
          tag: stable
          name: Stable
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: |
            goose-*.tar.bz2
            goose-*.tar.gz
            goose-*.zip
            Goose*.zip
            *.deb
            *.rpm
            *.flatpak
            download_cli.sh
          allowUpdates: true
          omitBody: true
          omitPrereleaseDuringUpdate: true

      - name: Upload macOS update manifest
        if: ${{ env.ENABLE_MAC_NATIVE_AUTO_UPDATE == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" latest-mac.yml --clobber
          gh release upload stable latest-mac.yml --clobber

      - name: Upload Linux (deb + rpm) update manifests
        if: ${{ env.ENABLE_LINUX_NATIVE_AUTO_UPDATE == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A manifest is only uploaded if its packages were built this run.
          for f in latest-linux.yml latest-linux-arm64.yml vulkan-linux.yml vulkan-linux-arm64.yml; do
            if [ -f "$f" ]; then
              gh release upload "${GITHUB_REF_NAME}" "$f" --clobber
              gh release upload stable "$f" --clobber
            else
              echo "::warning file=release.yml::$f was not generated; skipping upload"
            fi
          done
